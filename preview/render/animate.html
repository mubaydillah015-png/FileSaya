<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>Render PAPIYYAR</title>
<style>
@font-face{font-family:SE;src:url(fonts/SpecialElite.woff2)}
@font-face{font-family:PM;src:url(fonts/PermanentMarker.woff2)}
@font-face{font-family:BN;src:url(fonts/BebasNeue.woff2)}
html,body{margin:0;background:#000;overflow:hidden}
#v{width:540px;height:960px;display:block}
</style></head>
<body><div id="stage"></div>
<script src="helpers.js"></script>
<script>
// ---------- timing helpers ----------
const cl=x=>x<0?0:x>1?1:x;
const E=x=>1-Math.pow(1-cl(x),3);
const P=(t,a,b)=>E((t-a)/(b-a));
const B=x=>{x=cl(x);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const PB=(t,a,b)=>B((t-a)/(b-a));
const sc=(cx,cy,s,inner,op=1)=>`<g opacity="${op}" transform="translate(${cx} ${cy}) scale(${s}) translate(${-cx} ${-cy})">${inner}</g>`;
const popIn=(t,t0,cx,cy,inner,from=2.2,dur=.35)=>{if(t<t0)return '';const p=cl((t-t0)/dur);return sc(cx,cy,from+(1-from)*B(p),inner,cl(p*3))};
const draw=(d,p,stroke,w,extra='')=>p<=0?'':`<path d="${d}" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${(1-p).toFixed(4)}" stroke="${stroke}" stroke-width="${w}" fill="none" ${extra}/>`;
const fadeIn=(t,t0,inner,dur=.3)=>t<t0?'':`<g opacity="${cl((t-t0)/dur)}">${inner}</g>`;
const shake=(t,t0,dur,amp)=>{if(t<t0||t>t0+dur)return [0,0];const k=1-(t-t0)/dur;return [Math.sin(t*95)*amp*k,Math.cos(t*83)*amp*k]};

function ransomA(txt,x,y,size,opt,t,t0,step){let s='',cx=x,i=0;const fonts=['BN','SE','PM','Georgia','Impact'];
 for(const ch of txt){if(ch===' '){cx+=size*.45;continue}
  const w=size*.78,h=size*1.08,rot=r(-9,9),isRed=opt.redChars&&opt.redChars.includes(ch);
  const bgc=isRed?'#fff':['#fff','#F3EBD3','#1d1d1d','#E8D9B5','#fff'][Math.floor(r(0,5))];
  const fg=isRed?C.red:(bgc==='#1d1d1d'?'#fff':C.ink);const f=fonts[Math.floor(r(0,5))];const pts=torn(-w/2,-h*.78,w,h,2,6);
  const ta=t0+i*step;i++;
  if(t>=ta){const p=cl((t-ta)/.25);const k=2.4+(1-2.4)*B(p);
   s+=`<g transform="translate(${cx+w/2},${y}) rotate(${rot.toFixed(1)}) scale(${k})" opacity="${cl(p*3)}" filter="url(#sh)"><polygon points="${pts}" fill="${bgc}"/><text x="0" y="${(h*.12).toFixed(1)}" text-anchor="middle" font-family="${f}" font-size="${size}" font-weight="900" fill="${fg}">${ch}</text></g>`}
  cx+=w+size*.06}return s}

// ---------- VO & captions ----------
const SC=[
{n:1,D:6,vo:'Seorang pria duduk di ruang interogasi selama empat puluh menit... dan tatapannya tidak pernah lepas sedikit pun.'},
{n:2,D:5,vo:'Semua orang yakin dia jujur. Masalahnya... justru itu yang membuat saya curiga.'},
{n:3,D:6,vo:'Kasusnya begini. Sebuah kantor kehilangan uang kas tiga puluh juta rupiah dalam satu malam.'},
{n:4,D:10,vo:'Ada dua tersangka. Tersangka pertama gelisah, pelipisnya berkeringat, tangannya terus memainkan ujung baju, dan matanya melirik ke kiri atas setiap kali ditanya. Kata internet, itu tanda klasik pembohong.'},
{n:5,D:8,vo:'Tersangka kedua tenang. Duduk tegak, tangan di atas meja, menatap lurus, menjawab tanpa ragu. Rapi. Terlalu rapi.'},
{n:6,D:8,vo:'Penyidik sudah hampir menutup berkas. Si gelisah, jelas pelakunya. Mudah sekali, ya... seperti sinetron yang endingnya ketahuan dari episode satu.'},
{n:7,D:10,vo:'Tapi detektif tidak membaca gerakan. Detektif membaca perubahan. Pertama, ajak bicara soal hal remeh, cuaca, makan siang, jalan pulang. Catat cara dia bergerak saat santai. Itu garis dasarnya.'},
{n:8,D:6,vo:'Kedua, masukkan pertanyaan inti, lalu perhatikan. Bukan apa yang muncul, tapi apa yang tiba-tiba hilang.'},
{n:9,D:9,vo:'Dan di sinilah tamparannya. Si gelisah... memang gelisah sejak awal. Ngobrol soal cuaca pun tangannya tidak bisa diam. Dia bukan pembohong, dia cuma gampang panik.'},
{n:10,D:13,vo:'Sementara si tenang? Saat bicara soal makan siang, dia bersandar, tangannya bergerak bebas. Tapi begitu ditanya soal malam kejadian... tubuhnya membeku. Tatapannya terkunci. Tangannya diam total. Dia tidak tenang. Dia sedang menahan.'},
{n:11,D:4,vo:'Pembohong yang pintar tidak gugup, dia mengendalikan diri secara berlebihan.'},
{n:12,D:7,vo:'Papiyyar! Selama ini kita nuduh yang keringetan, padahal yang paling kalem itu yang paling sibuk ngatur napas, Cong.'},
{n:13,D:6,vo:'Penelitian bahkan menyebut, manusia menebak kebohongan dengan akurasi sekitar lima puluh empat persen. Hampir sama dengan lempar koin.'},
{n:14,D:8,vo:'Tapi tunggu dulu. Saat rekaman kamera pengawas diputar ulang, ada satu detail kecil... sesuatu yang dilakukan si gelisah tepat satu menit sebelum lampu kantor padam.'},
{n:15,D:7,vo:'Jadi menurutmu, siapa yang mengambil uang itu? Si tenang... atau justru mereka berdua? Tulis tebakanmu di kolom komentar.'},
];
const VO=[7.236,6.113,6.034,13.949,10.527,9.482,13.322,8.124,11.311,17.868,4.754,8.829,8.673,10.919,9.091];
const VO_LEAD=.15;
let acc=0;for(const [i,s] of SC.entries()){s.D0=s.D;s.D=+(VO[i]+VO_LEAD+.35).toFixed(3);s.T0=acc;acc+=s.D;
 const words=s.vo.split(' ');const chunks=[];let cur=[];
 for(const w of words){cur.push(w);const txt=cur.join(' ');if(txt.length>=22||/[.?!]$/.test(w)||(/,$/.test(w)&&txt.length>=12)){chunks.push(txt);cur=[]}}
 if(cur.length)chunks.push(cur.join(' '));
 const wt=chunks.map(c=>c.length+(/(\.\.\.|[.?!])$/.test(c)?8:/,$/.test(c)?3:0));const tot=wt.reduce((a,b)=>a+b,0);
 const lead=.15,usable=s.D-.3;let a=lead;s.caps=chunks.map((c,i)=>{const d=usable*wt[i]/tot;const o={a,b:a+d,txt:c};a+=d;return o})}
const TOTAL=acc;
const capAt=(s,t)=>{const c=s.caps.find(c=>t>=c.a&&t<c.b)||(t<s.caps[0].a?null:null);return c?c.txt.toUpperCase():''};
function captionA(txt,t,s){if(!txt)return '';const c=s.caps.find(c=>t>=c.a&&t<c.b);const p=cl((t-c.a)/.12);
 return `<g transform="translate(270 900) scale(${.85+.15*E(p)})" opacity="${p}"><text x="0" y="0" text-anchor="middle" font-family="BN" font-size="40" fill="#fff" stroke="${C.ink}" stroke-width="8" paint-order="stroke" letter-spacing="1">${txt}</text></g>`}
window.SRT=()=>{const f=x=>{const ms=Math.round(x*1000);const h=Math.floor(ms/3600000),m=Math.floor(ms/60000)%60,se=Math.floor(ms/1000)%60,mm=ms%1000;return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(se).padStart(2,'0')},${String(mm).padStart(3,'0')}`};
 let i=1,o='';for(const s of SC)for(const c of s.caps){o+=`${i++}\n${f(s.T0+c.a)} --> ${f(s.T0+c.b)}\n${c.txt}\n\n`}return o};

// ---------- scenes: return {body, cam:[s,cx,cy], sh:[dx,dy]} ----------
const D={};
D[1]=(t,d)=>{const op=P(t,.1,1.3);
 return {cam:[1+.22*E(t/d),270,420],body:`<rect width="540" height="960" fill="#111"/>
 <polygon points="${torn(60,150,420,620,14,22)}" fill="#7d7f84"/><rect x="60" y="150" width="420" height="620" fill="#6c6f75" opacity=".6"/>
 <g transform="rotate(${(Math.sin(t*1.8)*5).toFixed(2)} 270 150)"><line x1="270" y1="150" x2="270" y2="230" stroke="#222" stroke-width="3"/><polygon points="240,230 300,230 320,265 220,265" fill="#2c2e33" stroke="#111" stroke-width="2"/><polygon points="220,265 320,265 440,640 100,640" fill="#fff3c4" opacity="${(.2+.04*Math.sin(t*23)).toFixed(3)}"/></g>
 <g filter="url(#sh)"><circle cx="400" cy="230" r="34" fill="#F4EED7" stroke="${C.ink}" stroke-width="4"/><line x1="400" y1="230" x2="400" y2="205" stroke="${C.ink}" stroke-width="4" transform="rotate(${t*360/2} 400 230)"/><line x1="400" y1="230" x2="420" y2="240" stroke="${C.ink}" stroke-width="4" transform="rotate(${t*30} 400 230)"/></g>
 ${tenang(170,330,1.25,{eyePhoto:true})}
 <polygon points="90,640 450,640 470,700 70,700" fill="#4b3f36" stroke="${C.ink}" stroke-width="3" filter="url(#sh)"/>
 <g transform="translate(${-230*op} 0)"><polygon points="${torn(-10,120,300,700,16,20)}" fill="#E7DFC9"/>${newsprint(10,150,250,640,3)}</g>
 <g transform="translate(${230*op} 0)"><polygon points="${torn(250,120,310,700,16,20)}" fill="#E7DFC9"/>${newsprint(280,150,250,640,3)}</g>`}};
D[2]=(t,d)=>{const y=960-350*PB(t,2.0,2.6);const crack=P(t,2.4,2.9);const sh=shake(t,.35,.35,7);
 return {cam:[1+.04*t/d,270,480],sh,body:`${bg()}${newsprint(30,90,480,760,3)}
 ${polaroid(110,150,320,380,-4,tenang(48,40,1.4))}
 ${popIn(t,.3,265,420,stamp('JUJUR',265,420,-12,62))}
 ${draw('M220 360 l30 40 l-14 20 l36 30 l-10 24',crack,C.paper,6)}
 ${popIn(t,3.0,430,180,ransom('?',395,190,90))}
 ${detective(170,y,1.2,{brow:t>3?'up':'',mouth:'smirk'})}`}};
D[3]=(t,d)=>{const hy=-420*(1-PB(t,0,.6));
 return {cam:[1+.05*t/d,270,400],body:`${bg('#2f3036')}
 <g transform="translate(${140*(1-P(t,0,1.2))} 0)"><path d="M440 130 a50 50 0 1 0 30 80 a40 40 0 1 1 -30 -80z" fill="#F4EED7" filter="url(#sh)"/></g>
 <g transform="translate(0 ${hy})"><g transform="rotate(-3 270 260)" filter="url(#sh)"><polygon points="${torn(40,150,460,240,5)}" fill="#EFE7CF"/>
 <text x="60" y="185" font-family="SE" font-size="15" fill="${C.ink}">HARIAN KOTA · EDISI MALAM · 5 NOV</text><line x1="60" y1="195" x2="480" y2="195" stroke="${C.ink}" stroke-width="2"/>${newsprint(60,300,420,80,3)}</g>
 ${ransom('KAS KANTOR',62,250,40)}${ransomA('RAIB!',140,300,46,{redChars:'RAIB!'},t,.9,.12)}</g>
 <g filter="url(#sh)"><rect x="150" y="470" width="240" height="260" rx="10" fill="#5d6168" stroke="${C.ink}" stroke-width="4"/><rect x="172" y="492" width="196" height="216" fill="#1b1c20"/>
 <g transform="rotate(${-25*P(t,1.5,2.3)} 150 600)"><polygon points="150,470 60,500 60,760 150,730" fill="#73777e" stroke="${C.ink}" stroke-width="4"/><circle cx="105" cy="615" r="22" fill="none" stroke="${C.ink}" stroke-width="5"/></g></g>
 ${[...Array(12)].map((_,i)=>{const t0=2+i*.25;if(t<t0)return '';const k=t-t0;const x=270+r(-80,80)+k*r(-30,60);const y=560-k*r(70,130);const rt=r(-40,40)+k*r(-90,90);
  return `<g transform="translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${rt.toFixed(1)})" opacity="${(1-cl((k-2.2)/1.2)).toFixed(2)}" filter="url(#sh)"><rect width="62" height="30" fill="#c9b6d6" stroke="${C.ink}" stroke-width="1.5"/><text x="31" y="20" text-anchor="middle" font-family="BN" font-size="15" fill="${C.ink}">100.000</text></g>`}).join('')}`}};
D[4]=(t,d)=>{const j=(Math.floor(t*9)%2?2.5:-2.5);
 return {cam:[1.08-.05*t/d,200,350],body:`${bg('#B98E5E')}<rect width="540" height="960" fill="#00000015"/>
 ${[...Array(160)].map(()=>`<circle cx="${r(0,540)}" cy="${r(0,960)}" r="${r(1,3)}" fill="#7a5530" opacity=".5"/>`).join('')}
 ${polaroid(40,120,320,400,-3,gelisah(48+j,30+Math.abs(j)/2,1.4,{look:t>5.8}))}
 ${draw('M100 257 a48 26 -8 1 0 96 0 a48 26 -8 1 0 -96 0',P(t,6.0,6.6),C.red,5)}
 ${fadeIn(t,6.6,`<path d="M190 240 q30 -40 70 -30" stroke="${C.red}" stroke-width="4" fill="none"/><text x="250" y="200" font-family="PM" font-size="22" fill="${C.red}">kiri atas!</text>`)}
 <rect x="180" y="110" width="40" height="26" rx="4" fill="#9aa0a6" stroke="${C.ink}" stroke-width="2"/>
 <g transform="translate(${400*(1-PB(t,7.3,7.8))} 0)"><g transform="rotate(4 380 680)" filter="url(#sh)"><rect x="230" y="560" width="280" height="250" fill="#F7F5EF" stroke="${C.ink}" stroke-width="3"/><rect x="230" y="560" width="280" height="34" fill="#C7CCD3" stroke="${C.ink}" stroke-width="3"/>
 <circle cx="250" cy="577" r="6" fill="${C.red}"/><circle cx="268" cy="577" r="6" fill="#d8b23a"/><circle cx="286" cy="577" r="6" fill="#5b9a5b"/>
 <text x="250" y="630" font-family="BN" font-size="30" fill="${C.ink}">CIRI PEMBOHONG</text>
 ${['Berkeringat','Gelisah','Lirik kiri atas'].map((tx,i)=>`<text x="285" y="${675+i*40}" font-family="SE" font-size="19" fill="${C.ink}">${tx}</text>${draw(`M252 ${665+i*40} l8 9 l14 -18`,P(t,8.0+i*.45,8.3+i*.45),C.red,4)}`).join('')}</g></g>`}};
D[5]=(t,d)=>{const z=P(t,6.3,6.6);
 return {cam:[1+.04*t/d+.75*z,270+27*z,480-160*z],body:`${bg('#B98E5E')}<rect width="540" height="960" fill="#00000015"/>
 ${polaroid(110,110,330,430,2,tenang(55,30,1.5))}
 <g transform="translate(${-200*(1-PB(t,1.8,2.3))} 0)"><g transform="rotate(90 80 330)" filter="url(#sh)"><rect x="-80" y="300" width="330" height="40" fill="#EAD9A6" stroke="${C.ink}" stroke-width="2"/>${[...Array(33)].map((_,i)=>`<line x1="${-80+i*10}" y1="300" x2="${-80+i*10}" y2="${i%5?312:322}" stroke="${C.ink}" stroke-width="1.5"/>`).join('')}</g></g>
 ${t>5.2?`<g transform="translate(400,170) rotate(${t*90}) scale(${Math.sin(cl((t-5.2)/.6)*Math.PI)*1.3})"><path d="M0 -26 L6 -6 L26 0 L6 6 L0 26 L-6 6 L-26 0 L-6 -6z" fill="#fff" filter="url(#sh)"/></g>`:''}
 ${popIn(t,5.9,270,640,`<g transform="rotate(-6 270 640)" filter="url(#sh)"><polygon points="${torn(120,590,300,90,5)}" fill="#F4EED7"/><text x="270" y="650" text-anchor="middle" font-family="PM" font-size="40" fill="${C.red}">TERLALU RAPI.</text></g>`)}
 ${t>6.3?`<rect x="0" y="0" width="540" height="960" fill="#fff" opacity="${(1-cl((t-6.3)/.25))*.6}"/>`:''}`}};
D[6]=(t,d)=>{const sh=shake(t,4.3,.4,5);
 return {cam:[1.02+.04*t/d,270,480],sh,body:`${bg()}${newsprint(30,80,480,780,3,'#00000018')}
 <g filter="url(#sh)"><polygon points="40,520 500,520 500,860 40,860" fill="#B98A50" stroke="${C.ink}" stroke-width="3"/><polygon points="40,520 200,520 220,500 40,500" fill="#B98A50" stroke="${C.ink}" stroke-width="3"/></g>
 <g filter="url(#sh)"><polygon points="50,${540+260*(1-P(t,0,1))} 490,${560+240*(1-P(t,0,1))} 480,850 60,850" fill="#C99A5E" stroke="${C.ink}" stroke-width="2"/></g>
 ${detective(180,600-40*PB(t,.2,.8),.95,{eyes:t>5.6?'roll':'',mouth:t<3.5?'yawn':'smirk'})}
 ${polaroid(60,120,220,270,-6,gelisah(20,10,1))}
 ${draw('M170 260 C300 300 330 500 400 600',P(t,1.3,2.2),C.red,4)}<circle cx="170" cy="260" r="7" fill="${C.red}"/>
 ${popIn(t,2.3,170,380,`<g transform="rotate(-10 170 380)" filter="url(#sh)"><rect x="95" y="355" width="150" height="50" fill="${C.red}"/><text x="170" y="393" text-anchor="middle" font-family="BN" font-size="40" fill="#fff">PELAKU</text></g>`)}
 ${popIn(t,4.1,405,230,`<g filter="url(#sh)"><rect x="300" y="140" width="210" height="180" rx="22" fill="#6b5a48" stroke="${C.ink}" stroke-width="4"/><rect x="318" y="158" width="150" height="130" rx="18" fill="#9fb2b0"/><circle cx="487" cy="190" r="9" fill="#333"/><circle cx="487" cy="222" r="9" fill="#333"/><line x1="350" y1="140" x2="320" y2="100" stroke="${C.ink}" stroke-width="3"/><line x1="440" y1="140" x2="470" y2="100" stroke="${C.ink}" stroke-width="3"/>
 <svg x="318" y="158" width="150" height="130" viewBox="${40+10*P(t,4.4,5)} ${40+12*P(t,4.4,5)} ${90-30*P(t,4.4,5)} ${80-27*P(t,4.4,5)}">${gelisah(0,0,1,{hands:false})}</svg></g>`)}
 ${fadeIn(t,4.4,`<text x="393" y="345" text-anchor="middle" font-family="PM" font-size="18" fill="${C.ink}">*jreng jreng*</text>`)}`}};
D[7]=(t,d)=>({cam:[1+.04*t/d,270,480],body:`<rect width="540" height="960" fill="#DCE5EA"/><rect width="540" height="960" fill="url(#grid)"/><rect width="540" height="960" filter="url(#grain)" opacity=".3"/>
 ${[['awan',90],['piring',230],['jalan',370]].map(([k,x],i)=>popIn(t,3.3+i*.7,x+50,200,`<g filter="url(#sh)"><rect x="${x}" y="150" width="100" height="100" fill="#FBF8F0" stroke="${C.ink}" stroke-width="2" transform="rotate(${[-5,3,-2][i]} ${x+50} 200)"/>${tape(x+25,138,50,[-5,3,-2][i])}
 ${k==='awan'?`<path d="M${x+20} ${215} a18 18 0 0 1 10 -32 a24 24 0 0 1 44 4 a16 16 0 0 1 8 28z" fill="#cfd8de" stroke="${C.ink}" stroke-width="2.5"/>`:k==='piring'?`<ellipse cx="${x+50}" cy="210" rx="36" ry="16" fill="#fff" stroke="${C.ink}" stroke-width="2.5"/><ellipse cx="${x+50}" cy="200" rx="18" ry="11" fill="#f6f1e2" stroke="${C.ink}" stroke-width="2"/>`:`<path d="M${x+30} 240 C${x+40} 210 ${x+70} 200 ${x+60} 165" stroke="#a07b4f" stroke-width="12" fill="none"/><path d="M${x+30} 240 C${x+40} 210 ${x+70} 200 ${x+60} 165" stroke="#fff" stroke-width="2" stroke-dasharray="6 6" fill="none"/>`}</g>`,1.8)).join('')}
 ${draw('M40 430 Q90 410 140 432 T240 428 T340 434 T440 426 T510 430',P(t,5.8,8.2),C.ink,5)}
 ${fadeIn(t,8.6,`<text x="300" y="400" font-family="PM" font-size="34" fill="${C.ink}" transform="rotate(-4 300 400)">GARIS DASAR</text><path d="M300 410 q-20 10 -30 18" stroke="${C.ink}" stroke-width="2.5" fill="none"/>`)}
 ${fadeIn(t,5.8,`<text x="40" y="490" font-family="SE" font-size="16" fill="#3b4b55">1. obrolan santai → catat gerak normal</text>`)}
 ${detective(60-320*(1-PB(t,.2,.9)),520,1.15,{arm:'glass',mouth:'smirk',brow:t>1.8?'up':''})}`});
D[8]=(t,d)=>{const hole=t>3.9;const tw=P(t,3.9,4.8);
 return {cam:[1+.05*t/d,270,420],body:`<rect width="540" height="960" fill="#DCE5EA"/><rect width="540" height="960" fill="url(#grid)"/><rect width="540" height="960" filter="url(#grain)" opacity=".3"/>
 ${draw('M30 360 Q80 340 130 362 T220 356 L250 356 L275 560 L300 362 T400 356 T510 360',P(t,1.2,2.8),C.ink,5)}
 ${hole?`<polygon points="${torn(230,420,90,120,10,10)}" fill="#272A2F" transform="translate(${275*(1-E((t-3.9)/.2))*0} 0)"/>`:''}
 <g transform="translate(${500*(1-PB(t,0,.5))} 0)"><g transform="rotate(-6 270 220)" filter="url(#sh)"><rect x="120" y="170" width="300" height="110" fill="#FBF8F0" stroke="${C.ink}" stroke-width="3"/><text x="270" y="240" text-anchor="middle" font-family="BN" font-size="46" fill="${C.red}">MALAM KEJADIAN?</text></g></g>
 ${t>3.3?`<g transform="translate(${-100*(1-P(t,3.3,3.9))+60*tw} ${-60*tw})"><g filter="url(#sh)" transform="rotate(30 400 520)"><path d="M380 420 L392 600 L398 600 L392 420z M408 420 L404 600 L410 600 L420 420z" fill="#b8bcc2" stroke="${C.ink}" stroke-width="2"/></g>
 ${hole?`<g transform="rotate(25 420 480)"><polygon points="${torn(270,440,70,80,8,10)}" fill="#272A2F" filter="url(#sh)"/></g>`:''}</g>`:''}
 ${fadeIn(t,4.2,`<text x="270" y="680" text-anchor="middle" font-family="PM" font-size="30" fill="${C.ink}">apa yang <tspan fill="${C.red}">HILANG?</tspan></text>`)}
 ${fadeIn(t,1.2,`<text x="40" y="740" font-family="SE" font-size="16" fill="#3b4b55">2. pertanyaan inti → bandingkan</text>`)}`}};
