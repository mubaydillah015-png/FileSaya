  const lines=txt.split('|');const all=[];

    let cls='';if(/^\*.*\*$/.test(w)){cls='g';w=w.slice(1,-1);}else if(/^~.*~$/.test(w)){cls='dimw';w=w.slice(1,-1);}
    sp.textContent=w;if(cls==='g')sp.classList.add('g');sp.dataset.dim=cls==='dimw'?1:0;
    d.appendChild(sp);all.push(sp);d.appendChild(document.createTextNode(' '));});
    if(li<lines.length-1)d.appendChild(document.createElement('br'));});
  all.forEach((sp,i)=>{const tt=all.length>1?t0+(t1-t0)*0.72*i/(all.length-1):t0;WORDS.push({sp,t:tt,mode,sc});});
  document.getElementById('s'+sc).appendChild(d);
});
// seats for scene 9
{let g=document.getElementById('s9seats');let h='';for(let r=0;r<6;r++)for(let c=0;c<12;c++)h+=`<rect x="${10+c*24}" y="${102+r*50}" width="16" height="18"/>`;g.innerHTML=h;}

const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-cl(x),3);
function rnd(n){const x=Math.sin(n*12.9898)*43758.5453;return x-Math.floor(x);}
function sceneAt(t){for(let i=0;i<14;i++)if(t>=CUTS[i]&&t<CUTS[i+1])return i+1;return 14;}

window.setTime=function(t){
  const sc=sceneAt(t);const a=CUTS[sc-1],b=Math.min(CUTS[sc],TOTAL);const lt=t-a,dur=b-a,p=lt/dur;
  const f=Math.round(t*30);
  for(let i=1;i<=14;i++)$('s'+i).style.display=i===sc?'block':'none';
  const cam=$('s'+sc).querySelector('.cam');
  // camera: settle-in on cut + slow push
  const settle=1+0.05*(1-ease(lt/0.25));
  let push=1+0.06*p;let tx=0,ty=0;
  // words
  WORDS.forEach(o=>{if(o.sc!==sc)return;const q=(t-o.t);const sp=o.sp;
    if(q<0){sp.style.opacity=0;return;}
    if(o.mode==='slam'){const k=ease(q/0.18);sp.style.opacity=cl(q/0.06);sp.style.transform=`scale(${1.9-0.9*k})`;}
    else if(o.mode==='fade'){sp.style.opacity=ease(q/0.5);sp.style.transform='none';}
    else{const k=ease(q/0.16);sp.style.opacity=cl(q/0.08);sp.style.transform=`translateY(${8*(1-k)}px) scale(${1.18-0.18*k})`;}
    if(sp.dataset.dim==='1'){sp.style.color=q>0.25?'#5a5a5a':'#F5F5F5';}
  });
  // shake helper
  let shake=0;
  const hit=(tt,amp=3,len=0.25)=>{const q=t-tt;if(q>=0&&q<len)shake=Math.max(shake,amp*(1-q/len));};
  // per-scene fx
  if(sc===1){$('s1spot').style.opacity=0.85+0.15*rnd(f);}
  if(sc===2){const out=cl((t-S(4))/0.5);const fl=1+0.08*Math.sin(t*23)+0.05*rnd(f);
    $('s2flame').style.transform=`scale(${(1-out)*fl},${(1-out)*fl*(1+0.06*Math.sin(t*17))})`;
    $('s2glow').style.opacity=(1-out)*(0.85+0.15*rnd(f+3))*cl(lt/0.15);
    $('s2smoke').style.opacity=out*0.7*(1-cl((t-S(4)-1)/1.2));$('s2smoke').style.transform=`translateY(${-30*out}px)`;
    if(lt<0.12)$('flash').style.opacity=0;}
  if(sc===3){$('s3fig').style.transform=`scale(${1.06-0.1*p})`;$('s3line').style.transform=`scaleX(${ease((t-S(5)-0.5)/0.6)})`;hit(E(5)-0.6,2.5);}
  if(sc===4){tx=(rnd(f)-0.5)*2.2;ty=(rnd(f+7)-0.5)*2.2;cam.style.opacity=0.82+0.18*rnd(f+11);$('s4scratch').setAttribute('x',10+280*rnd(Math.floor(f/3)));
    hit(S(7),4);hit(S(9),5);}
  else cam.style.opacity=1;
  if(sc===5){const k=ease((t-S(10))/0.9);$('s5num').style.opacity=cl((t-S(10))/0.1);$('s5num').textContent=Math.round(15*k);
    $('s5ecg').style.strokeDashoffset=700*(1-cl(lt/2.6));}
  if(sc===6){const k=ease((t-S(12)+0.2)/0.6);$('s6hl').setAttribute('cy',140-30*k);$('s6hr').setAttribute('cy',132-30*k);$('s6hl').setAttribute('cx',80-15*k);$('s6hr').setAttribute('cx',240+15*k);
    $('s6lace').setAttribute('d',`M150 255 Q120 ${180-25*k} ${90-15*k} ${150-30*k} M150 255 Q190 ${170-25*k} ${230+15*k} ${140-30*k}`);hit(S(12)+0.4,3);}
  if(sc===7){$('s7l1').style.opacity=t>S(13)?0.7+0.3*rnd(f):0;$('s7l2').style.opacity=t>S(13)+0.6?0.7+0.3*rnd(f+5):0;
    $('s7run').setAttribute('transform',`translate(${-60*p} ${-10*p})`);push=1.04+0.04*p;}
  if(sc===8){const k=t<S(15)?'a':t<S(16)?'b':'c';['a','b','c'].forEach(x=>$('s8'+x).style.display=x===k?'inline':'none');
    // only show current headline
    [...$('s8').querySelectorAll('.head')].forEach((h,i)=>h.style.display=(['a','b','c'][i]===k)?'block':'none');
    const st=k==='a'?S(14):k==='b'?S(15):S(16);push=1.12-0.08*ease((t-st)/0.5);
    $('s8foot').setAttribute('transform',`translate(0 ${k==='c'?40*ease((t-S(16))/1):0})`);
    hit(S(14),3);hit(S(15),3);hit(S(16),3);}
  if(sc===9){push=1.02;}
  if(sc===10){$('s10rim').style.opacity=0.7+0.3*Math.sin(t*2.2);$('s10fig').style.transform=`scale(1,${1-0.015*Math.sin(t*5)})`;
    $('s10strike').style.transform=`scaleX(${ease((t-E(20)+0.1)/0.35)})`;
    const fade=cl((t-E(20)+0.1)/0.4);[...$('s10').querySelectorAll('.head')][1].style.opacity=1-0.6*fade;}
  if(sc===11){$('s11shine').style.left=(-60+400*cl((t-S(21)-0.25)/0.7))+'px';$('s11glow').style.opacity=cl((t-S(21))/0.2);hit(S(21),7,0.4);
    $('flash').style.opacity=0.55*(1-cl((t-S(21))/0.15))*(t>=S(21)?1:0);push=1+0.03*p;}
  else $('flash').style.opacity=0;
  if(sc===12){const br=[...$('s12bricks').children];br.forEach((r,i)=>{const tt=a+0.3+i*0.55;r.style.opacity=cl((t-tt)/0.1);r.setAttribute('transform',`translate(0 ${-14*(1-ease((t-tt)/0.2))})`);});
    const i=cl(Math.floor((lt-0.3)/0.55),0,9);const tgt=br[i];const yy=+tgt.getAttribute('y')-70;const xx=+tgt.getAttribute('x')-195;
    const ph=((lt-0.3)%0.55)/0.55;$('s12hand').setAttribute('transform',`translate(${xx} ${yy+20*Math.sin(ph*Math.PI)})`);
    $('s12hand').style.opacity=lt<5.6?1:1-cl((lt-5.6)/0.3);}
  if(sc===13){const k=ease(p);$('s13fig').style.transform=`translateY(${-60*k}px) scale(${1-0.45*k})`;$('s13light').style.opacity=0.6+0.4*p;
    $('s13legs').setAttribute('transform',`translate(150 410) scale(${Math.sin(t*14)>0?1:-1} 1) translate(-150 -410)`);}
  if(sc===14){$('s14edge').style.strokeDashoffset=240*(1-ease((t-a)/1.6));
    const endT=60.4;const e=cl((t-endT)/0.6);$('s14end').style.opacity=e;
    [...$('s14').querySelectorAll('.head')].forEach(h=>h.style.opacity=1-e);
    $('s14end').querySelector('img').style.transform=`scale(${1.12-0.12*ease((t-endT)/1.2)})`;}
  // overlays
  const hideUI=sc===14&&t>60.2;
  $('wm').style.opacity=hideUI?0:0.55;$('handle').style.opacity=hideUI?0:1;
  $('black').style.opacity=cl((t-(TOTAL-0.7))/0.7);
  cam.style.transform=`translate(${tx+(rnd(f+1)-0.5)*shake*2}px,${ty+(rnd(f+2)-0.5)*shake*2}px) scale(${push*settle})`;
  $('grain').style.transform=`translate(${Math.floor(rnd(f+9)*60)-30}px,${Math.floor(rnd(f+19)*60)-30}px)`;
  // caption
  let cw='';for(const [w,s0,s1] of CAP){if(t>=s0&&t<s1+0.15)cw=w;}
  $('cap').textContent=hideUI?'':cw.toLowerCase();$('capline').style.opacity=cw&&!hideUI?1:0;
};
window.TOTAL=TOTAL;
setTime(0);
