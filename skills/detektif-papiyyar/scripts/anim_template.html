<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Serif:ital@1&family=Space+Grotesk:wght@500;600&family=Special+Elite&display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#000;overflow:hidden}
svg{display:block}
.mono{font-family:'Special Elite',monospace}
.cap{font-family:'Space Grotesk';font-weight:600}
.kw{font-family:'Instrument Serif';font-style:italic}
.hd{font-family:'Anton'}
</style></head><body>
<svg id="v" width="360" height="640" viewBox="0 0 360 640" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const R='#B5203A',INK='#1A1A1A',PAPER='#F2EDE4',DARK='#23262C',KRAFT='#E8D9B5';
// === GANTI: batas waktu scene (detik) dari align_vo.py -> 'bounds'. Jumlah scene = B.length-1 ===
const B=[0,2.44,6.13,13.03,18.48,21.56,23.69,30.64,37.12,44.66,49.04,54.64,59.86,64.37];
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const outBack=p=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)};
const outCubic=p=>1-Math.pow(1-p,3);
let LT=0,T0=0,TG=0; // local time, scene start, global time
const L=abs=>abs-T0; // absolute -> local
const DEFS=`<defs>
<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="2" dy="3" stdDeviation="2" flood-opacity=".35"/></filter>
<clipPath id="lc"><circle cx="0" cy="0" r="15"/></clipPath>
<clipPath id="lc2"><circle cx="0" cy="0" r="50"/></clipPath>
<pattern id="news" width="60" height="14" patternUnits="userSpaceOnUse"><rect width="60" height="14" fill="#e9e4d8"/><rect x="2" y="4" width="50" height="2" fill="#9a958a"/><rect x="2" y="9" width="38" height="2" fill="#b3ad9f"/></pattern>
</defs>`;
const P=s=>`<g filter="url(#sh)">${s}</g>`;
// ---- animation wrapper: appears at absolute time t ----
function A(svg,t,type='pop',d=0.38){
 const lt=TG-t; if(lt<0) return '';
 const p=cl(lt/d);
 let tr='',op=1;
 if(type=='pop'){tr=`scale(${Math.max(0.001,outBack(p))})`;op=cl(p*3)}
 else if(type=='fade'){op=p}
 else if(type=='up'){tr=`translate(0px,${(1-outCubic(p))*60}px)`;op=cl(p*2)}
 else if(type=='down'){tr=`translate(0px,${-(1-outBack(p))*120}px)`;op=cl(p*3)}
 else if(type=='left'){tr=`translate(${(1-outCubic(p))*-200}px,0px)`;op=cl(p*2)}
 else if(type=='right'){tr=`translate(${(1-outCubic(p))*200}px,0px)`;op=cl(p*2)}
 else if(type=='stamp'){tr=`scale(${1+(1-outCubic(p))*1.6}) rotate(${(1-p)*-10}deg)`;op=cl(p*2.5)}
 return `<g style="transform-box:fill-box;transform-origin:center;transform:${tr||'none'}" opacity="${op}">${svg}</g>`;
}
const draw=(len,t,d=0.5)=>{const p=cl((TG-t)/d);return `stroke-dasharray="${len}" stroke-dashoffset="${len*(1-outCubic(p))}"`};
function bg(type){const f={paper:'paper.png',cork:'cork.png',sepia:'sepia.png',dark:'dark.png'}[type];
 if(type=='red')return `<rect width="360" height="640" fill="${R}"/>`;
 return `<image href="${f}" x="0" y="0" width="360" height="640" preserveAspectRatio="none"/>`}
function torn(x,y,w,h,fill,seed=1){let pts=[],n=14;for(let i=0;i<=n;i++){pts.push([x+w*i/n,y+((i*7+seed*3)%5)-2])}for(let i=0;i<=n;i++){pts.push([x+w-((i*5+seed)%5),y+h*i/n])}for(let i=n;i>=0;i--){pts.push([x+w*i/n,y+h+((i*3+seed*5)%6)-3])}for(let i=n;i>=0;i--){pts.push([x+((i*7+seed)%5),y+h*i/n])}return `<polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="${fill}"/>`}
function tape(x,y,r=-8){return `<rect x="${x}" y="${y}" width="46" height="14" fill="#f3e9b8" opacity=".85" transform="rotate(${r} ${x+23} ${y+7})"/>`}
function label(t,light){return A(`<text x="18" y="30" class="mono" font-size="10" fill="${light?'#d9cfc0':'#777'}">${t}</text>`,T0,'fade',0.3)}
// caption with word-by-word reveal; words appear starting at abs time ts
function caption(a,kw,b,light,ts,y=66,step=0.16){
 const c=light?'#fff':INK,kc=light?'#ff8a9a':R;
 const words=[];a.split(' ').filter(Boolean).forEach(w=>words.push([w,0]));kw.split(' ').filter(Boolean).forEach(w=>words.push([w,1]));(b||'').split(' ').filter(Boolean).forEach(w=>words.push([w,0]));
 let s=`<text x="18" y="${y}" class="cap" font-size="19" fill="${c}">`;
 words.forEach(([w,k],i)=>{const t=ts+i*step;const p=cl((TG-t)/0.22);const op=0.12+0.88*p;const dy=(1-outCubic(p))*6;
  s+=`<tspan ${k?`class="kw" font-size="22" fill="${kc}"`:`class="cap" fill="${c}"`} opacity="${op}" dy="0">${i?' ':''}${w}</tspan>`});
 return s+'</text>';
}
function head(t,ts,y=150,size=40,fill=INK){return A(`<text x="18" y="${y}" class="hd" font-size="${size}" fill="${fill}">${t}</text>`,ts,'pop',0.4)}
function logo(){return `<g transform="translate(330,26)" opacity=".75"><image href="logo-papiyyar.jpg" x="-15" y="-15" width="30" height="30" clip-path="url(#lc)"/></g>`}
function badge(n,ts,x=300,y=118){return A(P(`<rect x="${x}" y="${y}" width="30" height="34" rx="3" fill="${INK}"/><text x="${x+15}" y="${y+27}" class="hd" font-size="24" fill="#fff" text-anchor="middle">${n}</text>`),ts)}
// ---------- detective ----------
function det(pose='idle',x=205,y=440,s=1){
 const skin='#F1C9A0',coat='#B98E55',coatD='#8E6A3C',hat='#2B2B2B';
 const bob=Math.sin(TG*2.4)*2.5, sway=Math.sin(TG*1.3)*1.2;
 let arm='';
 const hand=(cx,cy)=>`<circle cx="${cx}" cy="${cy}" r="11" fill="${skin}" stroke="#fff" stroke-width="3"/>`;
 const sleeve=(d)=>`<path d="${d}" stroke="#fff" stroke-width="27" fill="none" stroke-linecap="round"/><path d="${d}" stroke="${coat}" stroke-width="21" fill="none" stroke-linecap="round"/>`;
 const w=Math.sin(TG*3)*4;
 if(pose=='mag'){arm=sleeve(`M40 150 Q10 120 ${20+w} 80`)+hand(20+w,76)+`<line x1="${20+w}" y1="70" x2="${12+w}" y2="40" stroke="${INK}" stroke-width="6"/><circle cx="${8+w}" cy="26" r="20" fill="#cfe6ee" fill-opacity=".55" stroke="${INK}" stroke-width="6"/>`}
 else if(pose=='shrug'){arm=sleeve('M40 150 Q5 140 10 105')+hand(10,100)+sleeve('M120 150 Q155 140 150 105')+hand(150,100)}
 else if(pose=='palm'){arm=sleeve('M40 150 Q30 90 65 62')+hand(66,58)}
 else if(pose=='point'){arm=sleeve(`M40 150 Q0 120 ${-25+w} ${95-w}`)+hand(-28+w,92-w)}
 else if(pose=='glasses'){arm=sleeve('M40 150 Q30 110 62 92')+hand(64,90)}
 else if(pose=='key'){const r=TG*400%360;arm=sleeve('M40 150 Q10 120 18 92')+hand(18,88)+`<g transform="translate(18,72) rotate(${r})"><g transform="translate(0,-14)"><circle r="9" fill="none" stroke="${R}" stroke-width="5"/><rect x="-2.5" y="8" width="5" height="22" fill="${R}"/><rect x="2" y="22" width="8" height="4" fill="${R}"/></g></g>`}
 else {arm=sleeve('M40 150 Q25 175 35 200')}
 const blink=(TG%3.7)<0.12;
 const squint=pose=='squint'||pose=='glasses';
 const eyes=blink?`<path d="M63 64h10M89 64h10" stroke="${INK}" stroke-width="2.5"/>`:squint?`<path d="M62 64h12M88 64h12" stroke="${INK}" stroke-width="3"/>`:`<circle cx="68" cy="64" r="3" fill="${INK}"/><circle cx="94" cy="64" r="3" fill="${INK}"/>`;
 const glassY=pose=='glasses'?80:64;
 return `<g transform="translate(${x},${y+bob}) scale(${s}) rotate(${sway} 80 230)" filter="url(#sh)">
 <path d="M18 230 L30 140 Q80 115 130 140 L145 230 Z" fill="#fff"/>
 <path d="M24 226 L35 145 Q80 122 125 145 L139 226 Z" fill="${coat}"/>
 <path d="M80 135 L60 226 M80 135 L100 226" stroke="${coatD}" stroke-width="4"/>
 <path d="M58 138 L80 175 L102 138 Z" fill="#fff"/><path d="M74 150 L80 170 L86 150 Z" fill="${R}"/>
 <path d="M42 145 L62 140 L70 185 Z M118 145 L98 140 L90 185 Z" fill="${coatD}"/>
 <circle cx="81" cy="70" r="40" fill="#fff"/><circle cx="81" cy="70" r="35" fill="${skin}"/>
 <path d="M50 85 Q81 112 112 85 Q100 108 81 110 Q62 108 50 85Z" fill="#6b4a32"/>
 ${eyes}
 <g fill="none" stroke="${INK}" stroke-width="2.5"><circle cx="68" cy="${glassY}" r="10"/><circle cx="94" cy="${glassY}" r="10"/><path d="M78 ${glassY}h6"/></g>
 <path d="M60 50 l14 -3 M88 47 l14 3" stroke="${INK}" stroke-width="3"/>
 <path d="M20 46 Q81 30 142 46 Q140 54 81 50 Q22 54 20 46Z" fill="#fff"/>
 <path d="M24 44 Q81 32 138 44 Q136 50 81 47 Q26 50 24 44Z" fill="${hat}"/>
 <path d="M45 42 Q48 6 81 4 Q114 6 117 42Z" fill="${hat}" stroke="#fff" stroke-width="3"/>
 <path d="M46 34 Q81 26 116 34 L117 41 Q81 34 45 41Z" fill="${R}"/>
 ${arm}</g>`;
}
// pose switch pop
function D(poses,x=205,y=440,s=1){let cur=poses[0][1],ct=T0;for(const [t,p] of poses){if(TG>=t){cur=p;ct=t}}const p=cl((TG-ct)/0.2);const k=0.94+0.06*outBack(p);return `<g style="transform-box:fill-box;transform-origin:center bottom;transform:scale(${k})">${det(cur,x,y,s)}</g>`}
// ---------- props ----------
const bulb=(x,y,s=1,on=true)=>`<g transform="translate(${x},${y}) scale(${s})" filter="url(#sh)">${on?`<circle cx="0" cy="-8" r="46" fill="#ffe27a" opacity=".35"/>`:''}<path d="M-26 -10 A28 28 0 1 1 26 -10 Q16 6 14 22 L-14 22 Q-16 6 -26 -10Z" fill="${on?'#FFF3B0':'#ddd'}" stroke="#fff" stroke-width="4"/><rect x="-14" y="22" width="28" height="16" rx="3" fill="#8b8b8b" stroke="#fff" stroke-width="3"/><path d="M-8 4 L-4 -10 L0 4 L4 -10 L8 4" stroke="#c9a23a" fill="none" stroke-width="2.5"/><rect x="-6" y="-46" width="12" height="7" fill="${R}"/></g>`;
const door=(x,y,open=0)=>P(`<rect x="${x}" y="${y}" width="110" height="170" fill="#5a3b22" stroke="#fff" stroke-width="5"/><rect x="${x+6}" y="${y+6}" width="98" height="158" fill="#111"/><path d="M${x+6} ${y+6} L${x+104-open} ${y+16} L${x+104-open} ${y+154} L${x+6} ${y+164}Z" fill="#8a5a33" stroke="#fff" stroke-width="3"/><circle cx="${x+92-open}" cy="${y+88}" r="5" fill="#e0c060"/>`);
const polaroid=(x,y,r,inner,cap)=>`<g transform="rotate(${r} ${x+55} ${y+65})">${P(`<rect x="${x}" y="${y}" width="110" height="130" fill="#fff"/><rect x="${x+8}" y="${y+8}" width="94" height="90" fill="#cfc7b8"/>`)}${inner}<text x="${x+55}" y="${y+120}" class="mono" font-size="10" text-anchor="middle" fill="#555">${cap}</text></g>`;
const stamp=(x,y,t,r=-12,size=18)=>`<g transform="rotate(${r} ${x} ${y})"><rect x="${x-t.length*size*.32-8}" y="${y-size}" width="${t.length*size*.64+16}" height="${size+10}" fill="none" stroke="${R}" stroke-width="3"/><text x="${x}" y="${y}" class="hd" font-size="${size}" fill="${R}" text-anchor="middle">${t}</text></g>`;
const qm=(x,y,s=22,o=.5,ph=0)=>`<text x="${x}" y="${y+Math.sin(TG*2+ph)*5}" class="hd" font-size="${s}" fill="#9a8f7c" opacity="${o}">?</text>`;
const icon=(k,x,y,s=1)=>{const g={
 lock:`<rect x="-16" y="-4" width="32" height="26" rx="4" fill="${INK}"/><path d="M-10 -4 V-14 A10 10 0 0 1 10 -14 V-4" stroke="${INK}" stroke-width="5" fill="none"/><circle cy="9" r="4" fill="${R}"/>`,
 cam:`<rect x="-20" y="-12" width="34" height="24" rx="4" fill="${INK}"/><circle cx="-3" cy="0" r="7" fill="#9ad"/><path d="M14 -6 L24 -12 V12 L14 6Z" fill="${INK}"/>`,
 spk:`<rect x="-14" y="-20" width="28" height="40" rx="12" fill="${INK}"/><circle cy="6" r="7" fill="#666"/><circle cy="-10" r="3" fill="${R}"/>`,
 bulb:`<circle cy="-4" r="13" fill="#FFE27A" stroke="${INK}" stroke-width="2"/><rect x="-6" y="8" width="12" height="9" fill="#888"/>`,
 phone:`<rect x="-12" y="-22" width="24" height="44" rx="4" fill="${INK}"/><rect x="-9" y="-17" width="18" height="32" fill="#7aa"/>`,
 laptop:`<rect x="-22" y="-16" width="44" height="28" rx="2" fill="${INK}"/><rect x="-18" y="-12" width="36" height="20" fill="#7aa"/><rect x="-28" y="12" width="56" height="6" rx="2" fill="#555"/>`,
 hdd:`<rect x="-16" y="-20" width="32" height="40" rx="4" fill="#555"/><circle cy="-2" r="9" fill="#999"/>`,
 tv:`<rect x="-24" y="-16" width="48" height="32" rx="3" fill="${INK}"/><rect x="-20" y="-12" width="40" height="24" fill="#456"/>`,
 ring:`<circle r="12" fill="none" stroke="#d4af37" stroke-width="5"/><path d="M-5 -14 L0 -22 L5 -14Z" fill="#9ef"/>`,
 router:`<rect x="-34" y="-10" width="68" height="22" rx="6" fill="${INK}"/><line x1="-22" y1="-10" x2="-28" y2="-34" stroke="${INK}" stroke-width="4"/><line x1="22" y1="-10" x2="28" y2="-34" stroke="${INK}" stroke-width="4"/><circle cx="-14" cy="1" r="3" fill="${(TG*4|0)%2?'#4c4':'#272'}"/><circle cx="-4" cy="1" r="3" fill="#4c4"/><circle cx="6" cy="1" r="3" fill="${R}"/>`,
 moon:`<circle r="15" fill="#444"/><circle cx="7" cy="-5" r="13" fill="#fff"/>`,
 bag:`<rect x="-16" y="-10" width="32" height="24" rx="3" fill="#6b4a32"/><path d="M-7 -10 V-16 H7 V-10" stroke="#6b4a32" stroke-width="4" fill="none"/>`,
 camoff:`<rect x="-20" y="-12" width="34" height="24" rx="4" fill="${INK}"/><path d="M14 -6 L24 -12 V12 L14 6Z" fill="${INK}"/><line x1="-24" y1="-16" x2="24" y2="16" stroke="${R}" stroke-width="4"/>`,
 cart:`<path d="M-20 -12 H-12 L-6 10 H16 L20 -6 H-10" stroke="${INK}" stroke-width="4" fill="none"/><circle cx="-4" cy="16" r="3" fill="${INK}"/><circle cx="14" cy="16" r="3" fill="${INK}"/>`}[k];
 return `<g transform="translate(${x},${y}) scale(${s})" filter="url(#sh)"><circle r="30" fill="#fff"/>${g}</g>`};
const check=(x,y)=>`<g transform="translate(${x},${y})"><circle r="9" fill="#2e8b57"/><path d="M-4 0 L-1 4 L5 -4" stroke="#fff" stroke-width="2.5" fill="none"/></g>`;
const xmark=(x,y,s,t)=>`<path d="M${x-s} ${y-s} L${x+s} ${y+s}" stroke="${R}" stroke-width="7" stroke-linecap="round" ${draw(s*3,t,0.15)}/><path d="M${x+s} ${y-s} L${x-s} ${y+s}" stroke="${R}" stroke-width="7" stroke-linecap="round" ${draw(s*3,t+0.12,0.15)}/>`;
const thread=(pts,t)=>{const a=pts.split(' ').map(p=>p.split(',').map(Number));let len=0;for(let i=1;i<a.length;i++)len+=Math.hypot(a[i][0]-a[i-1][0],a[i][1]-a[i-1][1]);return TG<t?'':`<polyline points="${pts}" fill="none" stroke="${R}" stroke-width="2.5" ${draw(len,t,0.5)}/>`};
const pin=(x,y)=>`<circle cx="${x}" cy="${y}" r="5" fill="${R}" stroke="#fff" stroke-width="1.5"/>`;
function receipt(x,y,lines,hl,ts,lineStep=0.35){const n=lines.length;const p=cl((TG-ts)/(n*lineStep));if(TG<ts)return '';const shown=Math.ceil(p*n);const H=shown*26+20;
 let s=P(`<path d="M${x} ${y} h170 v${H} ${Array.from({length:17},(_,i)=>`l-10 ${i%2?-6:6}`).join(' ')}Z" fill="#fff"/>`);
 lines.slice(0,shown).forEach((l,i)=>{s+=`<text x="${x+12}" y="${y+28+i*26}" class="mono" font-size="12" fill="${INK}">${l}</text>`});
 hl.forEach(([i,t])=>{if(TG>=t)s+=`<ellipse cx="${x+85}" cy="${y+24+i*26}" rx="84" ry="13" fill="none" stroke="${R}" stroke-width="2.5" transform="rotate(-2 ${x+85} ${y+24+i*26})" ${draw(560,t,0.4)}/>`});return s}
const envelope=(x,y,s=1,shake=0)=>`<g transform="translate(${x+Math.sin(TG*40)*shake},${y}) scale(${s}) rotate(${Math.sin(TG*33)*shake})" filter="url(#sh)"><rect x="-80" y="-50" width="160" height="100" fill="${KRAFT}"/><path d="M-80 -50 L0 10 L80 -50" fill="#d8c79c" stroke="#bfae84" stroke-width="2"/><circle cx="0" cy="8" r="14" fill="${R}"/><rect x="-36" y="22" width="72" height="22" fill="#fff"/><text x="0" y="40" class="hd" font-size="18" fill="${R}" text-anchor="middle">HOW?</text></g>`;

/* === SCENE: CONTOH dari episode 'Jebakan Rumah Pintar' (ToFu). Tulis ulang sesuai storyboard baru. ===
   Setiap S.push(()=>...) = satu scene, mengembalikan string SVG. Waktu memakai detik ABSOLUT video (TG).
   Helper penting: bg(), label(), caption(a,kw,b,terang,mulai), head(teks,mulai,y,ukuran,warna), A(svg,mulai,jenis),
   D([[waktu,pose],...],x,y,skala) untuk detektif, stamp(), receipt(), icon(), bulb(), door(), xmark(), thread(), badge(). */
const S=[];
const folder=(x,y,t)=>P(`<path d="M${x} ${y+14} h60 l10 -14 h90 v14 h20 v150 h-180z" fill="${KRAFT}"/><rect x="${x}" y="${y+14}" width="180" height="150" fill="#e2cf9f"/>`)+`<rect x="${x+20}" y="${y+40}" width="140" height="26" fill="#fff"/><text x="${x+90}" y="${y+58}" class="mono" font-size="11" text-anchor="middle" fill="${INK}">${t}</text><text x="${x+90}" y="${y+120}" class="hd" font-size="40" text-anchor="middle" fill="${INK}" opacity=".15">#2</text>`;
// 1
S.push(()=>bg('cork')+label('// 01 · TKP',1)+caption('Kasus kemarin belum','selesai.','',1,0.05)+head('KASUS #2',0.4,140,44,'#fff')+A(folder(90,190,'JEBAKAN RUMAH PINTAR'),0.15,'down')+A(stamp(180,330,'BELUM SELESAI',-10,20),1.3,'stamp',0.25)+`<g style="transform:translateY(${(1-outCubic(cl((TG-0.3)/0.5)))*260}px)">${D([[0,'mag']],200,420)}</g>`);
// 2
S.push(()=>{const op=cl((TG-2.6)/1.2)*40;const inside=TG>4.33;
 return bg('cork')+label('// 01 · TKP',1)+caption('Pintu itu dibuka...','dari dalam rumah.','',1,2.6,66,0.25)+head('DARI DALAM?',4.4,150,46,'#ff8a9a')+A(tape(150,180)+door(125,190,op),2.5,'pop')
 +(inside?A(`<path d="M175 300 L95 300" stroke="${R}" stroke-width="6"/><path d="M95 300 l14 -10 v20z" fill="${R}"/><text x="210" y="420" class="mono" font-size="12" fill="#e8dcc8" text-anchor="middle">dalam → luar</text>`,4.35,'left',0.3):'')+D([[T0,'squint']],205,440,.9)});
// 3
S.push(()=>{const empty=TG>6.9;
 return bg('paper')+label('// 02 · kronologi')+caption('tidak ada siapa pun di','bawah.','',0,6.9,66,0.2)+head(TG<11.8?'LANTAI BAWAH: KOSONG':'KAMERA: MATI',TG<11.8?7.2:11.9,140,32)
 +A(P(`<path d="M50 230 L180 165 L310 230 V420 H50Z" fill="${KRAFT}" stroke="#fff" stroke-width="4"/>`)+`<line x1="50" y1="320" x2="310" y2="320" stroke="#8a6a40" stroke-width="5"/><text x="60" y="250" class="mono" font-size="10" fill="#7a6a50">LANTAI ATAS</text><text x="60" y="340" class="mono" font-size="10" fill="#7a6a50">LANTAI BAWAH</text>`,6.2,'up')
 +(empty?A(`<g opacity=".55"><circle cx="180" cy="360" r="13" fill="none" stroke="${INK}" stroke-width="2.5" stroke-dasharray="5 4"/><path d="M160 412 Q180 368 200 412" fill="none" stroke="${INK}" stroke-width="2.5" stroke-dasharray="5 4"/></g><text x="230" y="385" class="hd" font-size="30" fill="${R}">0</text>`,7.0,'fade'):'')
 +A(`<rect x="130" y="275" width="100" height="30" rx="8" fill="#9fb3c8"/><circle cx="145" cy="282" r="12" fill="#F1C9A0"/><text x="${200}" y="${265-((TG*12)%10)}" class="hd" font-size="20" fill="#9a8f7c">Z z</text>`,9.5,'pop')
 +A(icon('cam',270,270,.6),11.0,'pop')+(TG>11.9?xmark(270,270,18,11.9):'')+D([[T0,'idle'],[11.9,'squint']],215,455,.85)});
// 4
S.push(()=>bg('paper')+label('// 02 · kronologi')+caption('catatan kunci tetap','keras kepala.','',0,13.2,66,0.2)+head('LOG: DARI DALAM',15.9,140,36,R)+receipt(40,170,['LOG KUNCI','01.55 UNLOCK','arah: DARI DALAM','pengguna: ???'],[[2,16.0]],13.3,0.4)+A(stamp(250,410,'KERAS KEPALA',8,18),14.6,'stamp',0.25)+D([[T0,'squint']],215,455,.85));
// 5
